[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cv-practice"
version = "0.1.0"
description = "Personal computer vision practice project"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "projects/assistive_gesture_control"}

[tool.setuptools.packages.find]
where = ["projects/assistive_gesture_control"]
include = ["agcp*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["agcp"]

[tool.pytest.ini_options]
testpaths = ["projects/assistive_gesture_control/tests"]
